<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/logo.webp">
<meta name="theme-color" content="#1a1a1a">
<style>
  :root{
    --plane:#f9f9f7; --surface:#fcfcfb;
    --ink:#0b0b0b; --ink-2:#52514e; --ink-muted:#898781;
    --grid:#e1e0d9; --line:#c3c2b7;
    --brand-ink:#1a1a1a; --brand-mint:#44ffcf;
    --blue:#2a78d6; --good:#0ca30c; --warning:#fab219;
    --serious:#ec835a; --critical:#d03b3b; --grey:#898781;
    --radius:10px;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--plane); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:14px; line-height:1.5;
  }
  a{color:inherit}
  .hidden{display:none !important}

  header.top{background:var(--brand-ink);border-bottom:1px solid #000}
  header.top .inner{
    max-width:900px;margin:0 auto;padding:16px 20px;
    display:flex;align-items:center;gap:12px;
  }
  header.top img{width:154px;height:18px;display:block}
  header.top strong{color:#fff;font-weight:600;font-size:14px}
  header.top .sep{color:#575652}

  .wrap{max-width:900px;margin:0 auto;padding:0 20px 72px}

  .head{padding:36px 0 22px;border-bottom:1px solid var(--grid)}
  .eyebrow{
    margin:0 0 6px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-muted);font-weight:600;
  }
  h1{margin:0;font-size:30px;letter-spacing:-.02em;line-height:1.15}
  .head p.intro{margin:12px 0 0;font-size:15px;color:var(--ink-2);max-width:62ch;white-space:pre-wrap}
  .asof{margin:14px 0 0;font-size:12.5px;color:var(--ink-muted)}

  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0 0}
  .tile{
    background:var(--surface);border:1px solid var(--grid);border-radius:var(--radius);
    padding:14px 14px 12px;
  }
  .tile b{display:block;font-size:26px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .tile span{display:block;margin-top:6px;font-size:12px;color:var(--ink-muted)}
  .tile[data-accent] b{color:var(--acc)}

  section.group{margin:30px 0 0}
  section.group > h2{
    margin:0 0 4px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;
    color:var(--ink);font-weight:700;
    display:flex;align-items:baseline;gap:8px;
  }
  section.group > h2 em{font-style:normal;color:var(--ink-muted);font-weight:500;letter-spacing:0;text-transform:none;font-size:12.5px}
  section.group > p.blurb{margin:0 0 12px;font-size:12.5px;color:var(--ink-muted)}

  .item{
    background:var(--surface);border:1px solid var(--grid);border-radius:var(--radius);
    padding:14px 16px;margin:0 0 8px;
  }
  .item .row1{display:flex;align-items:flex-start;gap:10px}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px;background:var(--grey)}
  .item h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.005em;flex:1}
  .pill{
    flex:none;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;
    border:1px solid currentColor;white-space:nowrap;
  }
  .meta{
    margin:8px 0 0 19px;display:flex;flex-wrap:wrap;gap:4px 14px;
    font-size:12.5px;color:var(--ink-muted);
  }
  .meta b{font-weight:600;color:var(--ink-2)}
  .note{
    margin:10px 0 0 19px;padding-left:12px;border-left:2px solid var(--grid);
    font-size:13.5px;color:var(--ink-2);white-space:pre-wrap;
  }
  .item[data-done="1"] h3{color:var(--ink-2)}

  .empty{
    background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);
    padding:30px 20px;text-align:center;color:var(--ink-muted);
  }

  footer.foot{
    margin:44px 0 0;padding:18px 0 0;border-top:1px solid var(--grid);
    font-size:12.5px;color:var(--ink-muted);
    display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;
  }
  footer.foot a{color:var(--ink-2)}
  footer.foot .spacer{flex:1}

  .state{max-width:520px;margin:14vh auto;padding:0 24px;text-align:center}
  .state h1{font-size:22px;margin:0 0 10px}
  .state p{color:var(--ink-2);margin:0}

  @media (max-width:720px){
    .tiles{grid-template-columns:repeat(2,1fr)}
    h1{font-size:24px}
  }
  @media print{
    body{background:#fff}
    header.top{background:#fff;border-bottom:1px solid #ccc}
    header.top strong,header.top .sep{color:#000}
    .item,.tile{break-inside:avoid}
  }
</style>
</head>
<body>

<header class="top">
  <div class="inner">
    <img src="/logo.webp" alt="wecomeone">
    <span class="sep">/</span>
    <strong>Progress</strong>
  </div>
</header>

<div id="loading" class="state">
  <h1>Loading</h1>
  <p>One moment.</p>
</div>

<div id="bad" class="state hidden">
  <h1>This link is not working</h1>
  <p>It may have been replaced with a newer one, or copied incompletely.
     Ask your contact at Wecomeone for a fresh link.</p>
</div>

<main id="page" class="wrap hidden">
  <div class="head">
    <p class="eyebrow" id="eyebrow">Project progress</p>
    <h1 id="clientName"></h1>
    <p class="intro hidden" id="intro"></p>
    <p class="asof" id="asOf"></p>
  </div>

  <div class="tiles" id="tiles"></div>
  <div id="groups"></div>

  <footer class="foot">
    <span>Prepared by <b>Wecomeone Marketing And Comms</b></span>
    <span class="spacer"></span>
    <a href="mailto:hello@wecomeone.me">hello@wecomeone.me</a>
    <a href="https://wecomeone.me" target="_blank" rel="noopener">wecomeone.me</a>
  </footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const CONFIG = {
  supabaseUrl: 'https://nubkifzfuvmmuwwiqwkk.supabase.co',
  supabaseKey: 'sb_publishable_yBzBj3_8fMXIYz5gzJ_3Lw_mOgKYv-J'
};

const LABEL = {
  not_started:'Not started', in_progress:'In progress', waiting:'On hold',
  blocked:'Blocked', review:'In review', done:'Completed'
};
const COLOR = {
  not_started:'#898781', in_progress:'#2a78d6', waiting:'#ec835a',
  blocked:'#d03b3b', review:'#fab219', done:'#0ca30c'
};

// Four sections, in the order a client cares about them.
const GROUPS = [
  { key:'active',    title:'Underway',  blurb:'Work in hand right now.',                     of:['in_progress','review'] },
  { key:'held',      title:'On hold',   blurb:'Paused, waiting on something before it moves.', of:['waiting','blocked'] },
  { key:'queued',    title:'Queued',    blurb:'Agreed and scheduled, not started yet.',      of:['not_started'] },
  { key:'completed', title:'Completed', blurb:'Delivered in the last two months.',           of:['done'] }
];

const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function niceDate(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return '';
  return dt.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}

function show(el){ document.getElementById(el).classList.remove('hidden'); }
function hide(el){ document.getElementById(el).classList.add('hidden'); }

function itemHTML(t, showDates){
  const done = t.status === 'done';
  const bits = [];
  if(t.project) bits.push(`<span><b>${esc(t.project)}</b></span>`);
  if(t.type)    bits.push(`<span>${esc(t.type)}</span>`);
  if(showDates){
    if(done && t.date_completed)   bits.push(`<span>Completed ${esc(niceDate(t.date_completed))}</span>`);
    else if(t.due_date)            bits.push(`<span>Due ${esc(niceDate(t.due_date))}</span>`);
    else if(t.date_started)        bits.push(`<span>Started ${esc(niceDate(t.date_started))}</span>`);
  }
  const c = COLOR[t.status] || '#898781';
  return `<article class="item" data-done="${done ? 1 : 0}">
    <div class="row1">
      <span class="dot" style="background:${c}"></span>
      <h3>${esc(t.title)}</h3>
      <span class="pill" style="color:${c}">${esc(LABEL[t.status] || t.status)}</span>
    </div>
    ${bits.length ? `<div class="meta">${bits.join('')}</div>` : ''}
    ${t.client_note ? `<p class="note">${esc(t.client_note)}</p>` : ''}
  </article>`;
}

function render(d){
  document.title = d.client + ' · Progress · Wecomeone';
  document.getElementById('clientName').textContent = d.headline || d.client;
  if(d.headline) document.getElementById('eyebrow').textContent = d.client;

  if(d.intro){
    const p = document.getElementById('intro');
    p.textContent = d.intro;
    p.classList.remove('hidden');
  }

  const tasks = d.tasks || [];
  const asOf = new Date(d.as_of);
  document.getElementById('asOf').textContent =
    'Live view, correct as of ' +
    asOf.toLocaleString('en-GB',{ day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) +
    '. Refresh at any time.';

  const count = keys => tasks.filter(t => keys.includes(t.status)).length;
  const tiles = [
    ['Underway',  count(['in_progress','review']), '#2a78d6'],
    ['On hold',   count(['waiting','blocked']),    '#ec835a'],
    ['Queued',    count(['not_started']),          '#898781'],
    ['Completed', count(['done']),                 '#0ca30c']
  ];
  document.getElementById('tiles').innerHTML = tiles.map(([label, n, acc]) =>
    `<div class="tile" data-accent style="--acc:${acc}"><b>${n}</b><span>${label}</span></div>`).join('');

  const out = GROUPS.map(g => {
    const list = tasks.filter(t => g.of.includes(t.status));
    if(!list.length) return '';
    return `<section class="group">
      <h2>${g.title} <em>${list.length}</em></h2>
      <p class="blurb">${g.blurb}</p>
      ${list.map(t => itemHTML(t, d.show_dates)).join('')}
    </section>`;
  }).join('');

  document.getElementById('groups').innerHTML = out ||
    `<div class="empty" style="margin-top:24px">Nothing on the board for you at the moment.</div>`;

  hide('loading');
  show('page');
}

(async function(){
  const token = (location.hash || '').replace(/^#/, '').trim();
  if(!token || !window.supabase){ hide('loading'); show('bad'); return; }

  try{
    // Deliberately signed out, always. This page shares an address with the
    // board, so without this a signed in colleague would query as themselves
    // and see a different page from the one the client sees.
    const SB = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey, {
      auth: {
        persistSession: false, autoRefreshToken: false, detectSessionInUrl: false,
        storage: { getItem:()=>null, setItem:()=>{}, removeItem:()=>{} }
      }
    });
    const { data, error } = await SB.rpc('client_progress', { p_token: token });
    if(error || !data || !data.ok){ hide('loading'); show('bad'); return; }
    render(data);
  }catch(err){
    console.error(err);
    hide('loading'); show('bad');
  }
})();
</script>
</body>
</html>
